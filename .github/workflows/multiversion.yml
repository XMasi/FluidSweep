name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ./gradlew -Pmc=${{ matrix.minecraft }} build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fluid-sweep-${{ matrix.minecraft }}
          path: build/${{ matrix.minecraft }}/libs/*.jar
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fluid-sweep-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Fluid Sweep 1.3.0 Beta — Minecraft 1.21 to 26.3
          prerelease: true
          generate_release_notes: true
          files: dist/*.jar

